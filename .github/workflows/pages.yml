# Publishes the game to GitHub Pages.
#
# `configure-pages` with `enablement: true` creates the Pages site on the first
# run, so this works without anyone visiting the repository settings. The whole
# repo is uploaded as the site: index.html sits at the root and is entirely
# self-contained, so there is nothing to build.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/mobile-mini-golf-game-f6vorl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
